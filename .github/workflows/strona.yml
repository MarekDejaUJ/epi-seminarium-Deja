name: Witryna

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  budowa:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Środowisko Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Paczka wzoru dla Overleaf
        run: |
          mkdir -p /tmp/paczka
          cp -r wzor-pracy/. /tmp/paczka/
          cd /tmp/paczka
          rm -f main.pdf *.aux *.bbl *.bcf *.blg *.fdb_latexmk *.fls *.idx *.ilg *.ind \
                *.lof *.log *.lop *.lot *.out *.run.xml *.synctex.gz *.toc *.xdv
          zip -r -q "$GITHUB_WORKSPACE/wzor-pracy/wzor-overleaf.zip" .

      - name: Budowa witryny
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Przekazanie wyniku
        uses: actions/upload-pages-artifact@v3

  publikacja:
    needs: budowa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - name: Publikacja
        id: publikacja
        uses: actions/deploy-pages@v4
